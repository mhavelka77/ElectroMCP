[project]
name = "electromcp"
version = "0.2.0"
description = "Smart KiCad 9 MCP Server"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "kicad-skip>=0.2.5",
    "cairosvg>=2.7.0",
]

[project.scripts]
electromcp = "electromcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["electromcp"]
